name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: deploy-prod

jobs:
  deploy:
    # Deploy only code that is on main of THIS repository:
    # - `workflow_run.branches: [main]` above filters on the triggering run's head_branch, which a
    #   fork PR opened from the fork's own `main` also matches — so the run must additionally come
    #   from a `push` event in this repository (a PR run has event `pull_request`);
    # - a manual run must be dispatched on main (the UI lets you pick any branch).
    # Second layer (external setting): the `production` environment has
    # the deployment branch policy `main` (required reviewers are optional).
    if: >-
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.event == 'push'
       && github.event.workflow_run.head_branch == 'main'
       && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    # Job-level permissions replace the workflow-level ones, hence the first two are repeated.
    # `actions: read` is for the manual-run CI gate below (it lists CI's runs via the API).
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      # The exact commit CI tested for workflow_run; the dispatched main commit otherwise.
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      # A workflow_run deploy only starts after CI succeeded for its commit (see `if:` above);
      # a manual run would deploy the main head even right after a failed CI. So before anything
      # is built or pushed, require a completed, successful CI run for exactly this commit on a
      # push to main of this repository (the latest such run decides; one still running fails
      # the job - wait for it and dispatch again). Logic and tests: scripts/ci-passed.sh,
      # deploy/tests/test_ci_passed.sh.
      - name: Require green CI for this commit (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-passed.sh "$GITHUB_REPOSITORY" "$DEPLOY_SHA"

      - id: meta
        run: echo "tag=sha-${DEPLOY_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once, load into the local Docker daemon (single-arch: the deploy
      # target is linux/amd64 only), and scan that exact image with Trivy
      # *before* anything reaches the registry. Only after the scan passes do
      # we push the already-built image — no rebuild, so the pushed bytes are
      # exactly what was scanned.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ghcr.io/lom911/gantt-ai-planner:${{ steps.meta.outputs.tag }}
            ghcr.io/lom911/gantt-ai-planner:latest

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/lom911/gantt-ai-planner:${{ steps.meta.outputs.tag }}
          # Block on HIGH too, but only when a fixed version exists (ignore-unfixed): an
          # unfixable base-image CVE would otherwise block every deploy with nothing to do.
          # So this gate covers FIXABLE HIGH/CRITICAL CVEs only (CI runs the same scan on PRs).
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # GHCR tags are mutable, so the server is told to deploy `sha-<short>@sha256:<digest>`:
      # Compose pulls exactly that manifest, whatever the tag points at by then. The digest
      # comes from this push itself, not from build-push-action's output: that build only
      # loaded the image into the local daemon, and the daemon may re-encode the manifest on
      # push, so only `docker push` knows the digest the registry actually stores.
      - name: Push scanned image to GHCR
        id: push
        env:
          IMAGE: ghcr.io/lom911/gantt-ai-planner
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG" | tee "$RUNNER_TEMP/push.log"
          docker push "$IMAGE:latest"
          digest="$(sed -nE "s/^${TAG}: digest: (sha256:[0-9a-f]{64}) size: [0-9]+\$/\\1/p" "$RUNNER_TEMP/push.log" | tail -n1)"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not read the pushed manifest digest from the docker push output"
            exit 1
          fi
          # The registry must serve that exact digest before the server is asked to pull it.
          docker buildx imagetools inspect "$IMAGE@$digest" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=$TAG@$digest" >> "$GITHUB_OUTPUT"
          # The server only accepts digest-pinned refs: keep this one findable for manual
          # deploys and rollbacks.
          echo "pushed $IMAGE:$TAG@$digest"
          {
            echo "### Image"
            echo
            echo "\`$IMAGE:$TAG@$digest\`"
            echo
            echo "Deploy / roll back to exactly this image: \`ssh deploy@<host> $TAG@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          # sha-<short>@sha256:<digest>; planner-deploy-wrapper validates the shape.
          TAG: ${{ steps.push.outputs.ref }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          # BatchMode: never fall back to an interactive prompt; IdentitiesOnly: offer only
          # the deploy key, never whatever else an agent on the runner might hold.
          ssh -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "$TAG"

      - name: Check production health
        run: curl -fsS https://gantt-ai-planner.duckdns.org/healthz
