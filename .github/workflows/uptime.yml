name: Uptime

# External uptime + operational-metrics check of production with alerting through GitHub
# issues:
# - /healthz and /api/meta from outside (after retries), and the authenticated
#   /api/ops/status (5xx rate, p95 latency, LLM tokens today, free disk, nightly backup
#   and its offsite copy);
# - any problem -> opens an issue labelled `uptime`, or comments on the one already open,
#   with the reasons, and fails the run (GitHub also emails the failure);
# - all fine -> closes any open `uptime` issue with a recovery comment.
# Scheduled runs only happen on the default branch and may start late when Actions is
# busy; GitHub disables schedules after 60 days without repository activity (re-enable in
# the Actions tab).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://gantt-ai-planner.duckdns.org
      ATTEMPTS: "3"
      RETRY_DELAY: "20"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Probe /healthz and /api/meta
        id: probe
        run: |
          # Actions starts steps with `bash -e`: switch it off, every failure here is handled.
          set +e -uo pipefail
          problems_file="$RUNNER_TEMP/probe-problems.md"
          : > "$problems_file"

          # check_once: 0 if both endpoints are fine, else 1 with the reasons in $problems.
          check_once() {
            problems=""
            body="$RUNNER_TEMP/body.json"

            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 15 "$BASE_URL/healthz" 2>"$RUNNER_TEMP/curl.err")" || code="000"
            if [ "$code" != "200" ]; then
              problems+="- \`/healthz\`: HTTP $code $(head -c 200 "$RUNNER_TEMP/curl.err" | tr '\n' ' ')"$'\n'
            elif [ "$(jq -r '.status // empty' "$body" 2>/dev/null)" != "ok" ]; then
              problems+="- \`/healthz\`: HTTP 200 but body is not {\"status\":\"ok\"}: \`$(head -c 200 "$body" | tr -d '\n`')\`"$'\n'
            fi

            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 15 "$BASE_URL/api/meta" 2>"$RUNNER_TEMP/curl.err")" || code="000"
            if [ "$code" != "200" ]; then
              problems+="- \`/api/meta\`: HTTP $code $(head -c 200 "$RUNNER_TEMP/curl.err" | tr '\n' ' ')"$'\n'
            else
              mode="$(jq -r '.llm_mode // empty' "$body" 2>/dev/null)"
              if [ -z "$mode" ]; then
                problems+="- \`/api/meta\`: HTTP 200 but no \`llm_mode\` in \`$(head -c 200 "$body" | tr -d '\n`')\`"$'\n'
              elif [ "$mode" = "fake" ]; then
                problems+="- \`/api/meta\`: \`llm_mode\` is \`fake\` - the LLM API key is missing/empty on the server (demo mode in production)"$'\n'
              fi
            fi
            [ -z "$problems" ]
          }

          healthy=false
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if check_once; then
              healthy=true
              echo "attempt $attempt/$ATTEMPTS: OK (llm_mode=$mode)"
              break
            fi
            echo "attempt $attempt/$ATTEMPTS failed:"
            printf '%s' "$problems"
            [ "$attempt" -lt "$ATTEMPTS" ] && sleep "$RETRY_DELAY"
          done
          [ "$healthy" = true ] || printf '%s' "$problems" > "$problems_file"
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"

      # GET /api/ops/status (bearer OPS_TOKEN = secrets/ops_token on the server) returns
      # {"window_minutes":15,"requests":N,"errors_5xx":N,"error_rate":F,"p95_ms":F,
      #  "tokens_today":N,"chat_messages_today":N,"disk_free_ratio":F,
      #  "backup":{"status":"ok"|"fail"|"unknown","last_ok":ISO|null,"age_hours":F|null,
      #    "offsite":{"status":"ok"|"fail"|"not_configured"|"unknown",...same keys}|null}}.
      # No secret -> skipped with a notice; 404 -> endpoint not deployed yet (notice).
      - name: Check operational metrics (/api/ops/status)
        id: ops
        if: ${{ !cancelled() }}
        env:
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          set +e -uo pipefail
          problems_file="$RUNNER_TEMP/ops-problems.md"
          : > "$problems_file"
          problem() { printf -- '- %s\n' "$1" >> "$problems_file"; }

          if [ -z "${OPS_TOKEN:-}" ]; then
            echo "::notice title=Ops check skipped::the OPS_TOKEN secret is not set"
            exit 0
          fi
          # The header goes through a 0600 file, not the command line (visible in ps).
          auth="$RUNNER_TEMP/ops-auth"
          (umask 077 && printf 'Authorization: Bearer %s\n' "$OPS_TOKEN" > "$auth")
          body="$RUNNER_TEMP/ops.json"
          for attempt in $(seq 1 "$ATTEMPTS"); do
            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 15 -H @"$auth" \
              "$BASE_URL/api/ops/status" 2>"$RUNNER_TEMP/ops-curl.err")" || code="000"
            case "$code" in
              000 | 5??) [ "$attempt" -lt "$ATTEMPTS" ] && { sleep "$RETRY_DELAY"; continue; } ;;
            esac
            break
          done
          rm -f "$auth"

          case "$code" in
            200) ;;
            404)
              echo "::notice title=Ops check skipped::$BASE_URL/api/ops/status answers 404 (endpoint not deployed yet)"
              exit 0 ;;
            401 | 403)
              problem "\`/api/ops/status\`: HTTP $code - the OPS_TOKEN secret does not match /opt/gantt-planner/secrets/ops_token"
              exit 0 ;;
            *)
              problem "\`/api/ops/status\`: HTTP $code $(head -c 200 "$RUNNER_TEMP/ops-curl.err" | tr '\n' ' ')"
              exit 0 ;;
          esac
          if ! jq -e 'type == "object" and (.backup | type) == "object"
              and ((.backup.offsite | type) == "object" or .backup.offsite == null)' "$body" >/dev/null 2>&1; then
            problem "\`/api/ops/status\`: HTTP 200 but unexpected body: \`$(head -c 200 "$body" | tr -d '\n`')\`"
            exit 0
          fi
          jq -r '"requests=\(.requests) errors_5xx=\(.errors_5xx) error_rate=\(.error_rate) p95_ms=\(.p95_ms) tokens_today=\(.tokens_today) chat_messages_today=\(.chat_messages_today) disk_free_ratio=\(.disk_free_ratio) backup=\(.backup.status) last_ok=\(.backup.last_ok) age_hours=\(.backup.age_hours) offsite=\(.backup.offsite.status) offsite_last_ok=\(.backup.offsite.last_ok) offsite_age_hours=\(.backup.offsite.age_hours)"' "$body"
          # Thresholds. Null-guarded: in jq, null < 0.1 is true.
          # The offsite copy alerts on fail, on unknown and past the local dump's 30 h - but
          # never on not_configured (enabled by a separate server setting,
          # /etc/gantt-planner/offsite.conf), nor on offsite = null: no offsite_* line in the status file at all, the
          # copy has never run there (or the app predates the field). Once it has run, its lines
          # stay in the file, so a copy that stops running still ages into the alert. An
          # unreadable file is already reported as the local backup's "unknown".
          jq -r '
            def pct: (. * 1000 | round) / 10;
            def win: "the last \(.window_minutes // "?") min";
            (if (.requests // 0) >= 20 and (.error_rate // 0) > 0.05 then
              "- 5xx error rate \(.error_rate | pct)% (\(.errors_5xx // "?") of \(.requests) requests in \(win)) > 5%" else empty end),
            (if (.p95_ms // 0) > 3000 then
              "- p95 latency \(.p95_ms | round) ms over \(win) > 3000 ms" else empty end),
            (if (.tokens_today // 0) > 3000000 then
              "- LLM tokens spent today: \(.tokens_today) > 3000000 (\(.chat_messages_today // "?") chat messages)" else empty end),
            (if .disk_free_ratio != null and .disk_free_ratio < 0.10 then
              "- free disk space: \(.disk_free_ratio | pct)% < 10%" else empty end),
            (if .backup.status == "fail" then
              "- the last nightly backup FAILED (newest good one: \(.backup.last_ok // "never"))" else empty end),
            (if .backup.status == "unknown" then
              "- nightly backup status unknown: /var/lib/gantt-planner/backup-status is unreadable or has no valid status/time" else empty end),
            (if .backup.age_hours != null and .backup.age_hours > 30 then
              "- the newest good backup is \(.backup.age_hours | round) h old (> 30 h)" else empty end),
            (if .backup.offsite.status == "fail" then
              "- the last offsite copy FAILED: the dump did not reach the backups repository (newest good copy: \(.backup.offsite.last_ok // "never"))" else empty end),
            (if .backup.offsite.status == "unknown" and .backup.status != "unknown" then
              "- offsite copy status unknown: no valid offsite_status/offsite_last_ok in /var/lib/gantt-planner/backup-status" else empty end),
            (if .backup.offsite.status != "not_configured" and .backup.offsite.age_hours != null
                and .backup.offsite.age_hours > 30 then
              "- the newest offsite copy is \(.backup.offsite.age_hours | round) h old (> 30 h)" else empty end)
          ' "$body" >> "$problems_file"
          if [ -s "$problems_file" ]; then
            echo "thresholds breached:"
            cat "$problems_file"
          else
            echo "all operational metrics within thresholds"
          fi

      - name: Decide and write the report
        id: report
        if: ${{ !cancelled() }}
        env:
          OPS_OUTCOME: ${{ steps.ops.outcome }}
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/probe-problems.md"
          ops="$RUNNER_TEMP/ops-problems.md"
          touch "$probe" "$ops"
          if [ "$OPS_OUTCOME" != "success" ]; then
            echo "- the ops check step itself failed ($OPS_OUTCOME) - see the run log" >> "$ops"
          fi
          report="$RUNNER_TEMP/uptime-report.md"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -s "$probe" ] || [ -s "$ops" ]; then
            alert=true
            {
              printf 'Production check failed at **%s** (%s).\n\n' "$now" "$RUN_URL"
              if [ -s "$probe" ]; then
                printf 'Uptime - last of %s attempts %ss apart:\n\n' "$ATTEMPTS" "$RETRY_DELAY"
                cat "$probe"
                echo
              fi
              if [ -s "$ops" ]; then
                printf "Operational metrics (\`/api/ops/status\`):\n\n"
                cat "$ops"
                echo
              fi
            } > "$report"
          else
            alert=false
            printf 'Production is healthy again as of %s (%s).\n' "$now" "$RUN_URL" > "$report"
          fi
          echo "alert=$alert" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Open or update the uptime issue
        if: ${{ !cancelled() && steps.report.outputs.alert == 'true' }}
        env:
          REPORT: ${{ steps.report.outputs.report }}
        run: |
          set -euo pipefail
          gh label create uptime --color B60205 \
            --description "Production uptime/metrics check is failing (opened by the Uptime workflow)" --force
          issue="$(gh issue list --label uptime --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$REPORT"
            echo "commented on #$issue"
          else
            gh issue create --title "Production is down or degraded: gantt-ai-planner.duckdns.org" \
              --label uptime --body-file "$REPORT"
          fi

      - name: Close the uptime issue on recovery
        if: ${{ !cancelled() && steps.report.outputs.alert == 'false' }}
        env:
          REPORT: ${{ steps.report.outputs.report }}
        run: |
          set -euo pipefail
          # No label yet means no uptime issue was ever opened: nothing to close.
          issues="$(gh issue list --label uptime --state open --json number --jq '.[].number' 2>/dev/null || true)"
          for issue in $issues; do
            gh issue close "$issue" --reason completed --comment "$(cat "$REPORT")"
            echo "closed #$issue"
          done

      - name: Fail the run while production is unhealthy
        if: ${{ !cancelled() && steps.report.outputs.alert == 'true' }}
        run: |
          echo "::error::production check failed - see the open 'uptime' issue"
          exit 1
