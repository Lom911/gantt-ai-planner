name: Evals

# Weekly live-LLM evals against production (backend/evals, see backend/evals/README.md):
# the agent's behaviour with the real model - prompt, tools, model updates - which the
# deterministic test suite with the fake LLM can't see. Alerting through GitHub issues,
# like the Uptime workflow:
# - a failed run -> opens an issue labelled `evals` (or comments on the open one) with the
#   PASS/FAIL table and fails the run (GitHub also emails the failure);
# - a passing run -> closes any open `evals` issue.
# Each run costs LLM tokens and uses 6 new sessions + 7 chat messages of production's
# per-IP / daily limits from the runner's address - keep it weekly. Scheduled runs happen
# on the default branch only.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://gantt-ai-planner.duckdns.org
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run the evals against production
        id: run
        working-directory: backend
        env:
          # stdout is a pipe (tee): force UTF-8, the table and replies are Cyrillic.
          PYTHONUTF8: "1"
        run: |
          # Every outcome is handled below: no `-e`.
          set +e -uo pipefail
          log="$RUNNER_TEMP/evals.log"
          uv run --frozen python -m evals.run --base-url "$BASE_URL" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          report="$RUNNER_TEMP/evals-report.md"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$status" -eq 0 ]; then
            printf 'Live-LLM evals pass again as of %s (%s).\n' "$now" "$RUN_URL" > "$report"
          else
            {
              printf 'Live-LLM evals failed at **%s** against %s (exit %s, %s).\n\n' \
                "$now" "$BASE_URL" "$status" "$RUN_URL"
              echo 'Output (last 60 lines):'
              echo
              echo '```'
              tail -n 60 "$log"
              echo '```'
              cat <<'EOF'

          The model wording varies between runs: re-run the failed scenario with
          `uv run python -m evals.run --base-url ... --only NAME -v` before blaming the app.
          See backend/evals/README.md.
          EOF
            } > "$report"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Open or update the evals issue
        if: steps.run.outputs.status != '0'
        env:
          REPORT: ${{ steps.run.outputs.report }}
        run: |
          set -euo pipefail
          gh label create evals --color D93F0B \
            --description "Live-LLM evals against production are failing (opened by the Evals workflow)" --force
          issue="$(gh issue list --label evals --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$REPORT"
            echo "commented on #$issue"
          else
            gh issue create --title "Live-LLM evals are failing on gantt-ai-planner.duckdns.org" \
              --label evals --body-file "$REPORT"
          fi

      - name: Close the evals issue when they pass
        if: steps.run.outputs.status == '0'
        env:
          REPORT: ${{ steps.run.outputs.report }}
        run: |
          set -euo pipefail
          # No label yet means no evals issue was ever opened: nothing to close.
          issues="$(gh issue list --label evals --state open --json number --jq '.[].number' 2>/dev/null || true)"
          for issue in $issues; do
            gh issue close "$issue" --reason completed --comment "$(cat "$REPORT")"
            echo "closed #$issue"
          done

      - name: Fail the run while the evals fail
        if: steps.run.outputs.status != '0'
        run: |
          echo "::error::live-LLM evals failed - see the open 'evals' issue"
          exit 1
