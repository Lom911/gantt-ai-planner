version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # The backend's Python (3.12) is pinned together with backend/.python-version and the
    # CI; moving to 3.13/3.14 is a deliberate upgrade of the whole backend, not a bot PR.
    # New 3.12 patch releases and base-image digests still come in.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # docker-compose.yml (dev), deploy/compose.prod.yml and deploy/caddy/compose.yml
  # pin images by digest;
  # "docker-compose" (distinct from "docker" above, which covers ./Dockerfile)
  # is the ecosystem that scans compose files themselves.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # A Postgres major upgrade needs pg_upgrade or a dump/restore of the data volume:
    # the new server refuses the old data directory. Done by hand, never by a bot PR.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # A Postgres major upgrade needs pg_upgrade or a dump/restore of the data volume:
    # the new server refuses the old data directory. Done by hand, never by a bot PR.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/deploy/caddy"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
