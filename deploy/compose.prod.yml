# Production stack for the gantt-planner app, deployed at /opt/gantt-planner
# on the shared VPS. Started with:
#   docker compose -f compose.prod.yml up -d
# from /opt/gantt-planner (so relative secrets:/ .env resolve correctly).
#
# IMAGE_TAG (in .env) names the app image as a digest-pinned `sha-<hex>@sha256:<digest>`
# (written by planner-deploy, which refuses bare tags: GHCR tags are mutable). There is
# deliberately no default (no silent `latest`): without it every compose command fails fast.
#
# Networks:
#   - planner-proxy: external AND internal (no route out of it), created once by
#     deploy/bootstrap.sh (`docker network create --internal planner-proxy`).
#     Only the Caddy reverse proxy (/opt/caddy) and `app` are attached, so no
#     other container on this shared host can reach the app directly. Caddy
#     finds the app by its alias `planner-app` on this network.
#   - backend: internal-only, app/migrate <-> db traffic never leaves it.
#   - egress: project-local bridge network shared with nothing else - the
#     app's only route out (outbound HTTPS to the LLM API: OpenRouter/Anthropic).
#   The app is deliberately NOT on Caddy's shared `edge` network.
#
# See docs/runbook.md for operational procedures.

networks:
  planner-proxy:
    external: true
  backend:
    internal: true
  egress: {}

secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  openrouter_api_key:
    file: ./secrets/openrouter_api_key
  db_app_password:
    file: ./secrets/db_app_password
  db_owner_password:
    file: ./secrets/db_owner_password
  pg_superuser_password:
    file: ./secrets/pg_superuser_password
  # Bearer token for GET /api/ops/status (generated by bootstrap.sh; the same value is the
  # OPS_TOKEN secret of the Uptime workflow).
  ops_token:
    file: ./secrets/ops_token

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    shm_size: 64mb
    mem_limit: 256m
    command: postgres -c shared_buffers=64MB -c max_connections=20
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets:
      - db_app_password
      - db_owner_password
      - pg_superuser_password
    volumes:
      - /var/lib/gantt-planner/pg:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    # The entrypoint starts as root only to fix ownership/modes of the data dir
    # (CHOWN, FOWNER, DAC_OVERRIDE: the bind mount is 0700 70:70), then drops to
    # the postgres user (SETUID, SETGID via su-exec). Nothing else is needed.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: ghcr.io/alomaev-hue/gantt-ai-planner:${IMAGE_TAG:?IMAGE_TAG must be set}
    command: ["alembic", "upgrade", "head"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: planner
      DB_USER: planner_owner
      SECRETS_DIR: /run/secrets
    secrets:
      - source: db_owner_password
        target: db_password
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    # Same hardening as `app` (the image already runs as uid 10001): this container holds the
    # owner (DDL) password, so it gets no more privileges than the app itself.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ghcr.io/alomaev-hue/gantt-ai-planner:${IMAGE_TAG:?IMAGE_TAG must be set}
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: planner
      DB_USER: planner_app
      SECRETS_DIR: /run/secrets
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-5}
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: https://gantt-ai-planner.duckdns.org
      # The app publishes no ports: requests only arrive through Caddy, the only other member
      # of the planner-proxy network, and Caddy overwrites X-Forwarded-* from clients. So trust
      # them — uvicorn for the scheme, the app for the per-IP limits (last X-Forwarded-For
      # hop = real client).
      FORWARDED_ALLOW_IPS: "*"
      TRUST_PROXY: "true"
      # No public Swagger/OpenAPI in production.
      API_DOCS: "false"
    secrets:
      - anthropic_api_key
      - openrouter_api_key
      - ops_token
      - source: db_app_password
        target: db_password
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Read-only view of the host state dir for /api/ops/status: backup.sh (and the offsite
    # copy) record their outcome in /var/lib/gantt-planner/backup-status. A directory, not
    # the file: the status file is replaced by rename, which a file bind mount would not
    # follow. The Postgres data dir inside (pg/, 0700 uid 70) stays unreadable for uid 10001.
    volumes:
      - /var/lib/gantt-planner:/var/lib/gantt-planner:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 300m
    pids_limit: 256
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      backend: {}
      egress: {}
      planner-proxy:
        aliases:
          - planner-app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
