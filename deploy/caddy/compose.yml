# Shared reverse-proxy stack for the whole VPS, deployed once at /opt/caddy.
# Terminates TLS (Let's Encrypt HTTP-01) for every site on this host,
# including gantt-ai-planner.duckdns.org. Started by deploy/bootstrap.sh
# and left running independently of the app stack's deploys.
#
# Networks (both external, created once by deploy/bootstrap.sh):
#   - edge: shared with the other sites' upstreams on this host.
#   - planner-proxy: internal (no route out), shared ONLY with the planner
#     `app` container, which Caddy reaches as `planner-app:8000`. The app is
#     not on `edge`, so nothing but Caddy can talk to it.
# Only touches these networks and ports 80/443 - never other services on
# this shared host.

networks:
  edge:
    external: true
  planner-proxy:
    external: true

volumes:
  caddy_data:
  caddy_config:

services:
  caddy:
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    mem_limit: 64m
    # Hardening (the only container of the planner setup that faces the internet): a
    # read-only root filesystem - Caddy writes only certificates/ACME state to /data,
    # its autosaved config to /config (both volumes) and scratch files to /tmp; no
    # capabilities except binding ports 80/443; no privilege gain through setuid/file
    # capabilities; bounded process count.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - planner-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
