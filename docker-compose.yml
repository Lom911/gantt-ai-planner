services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 3s
      retries: 20
  migrate:
    profiles: ["full"]
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &appenv
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: planner
      DB_USER: planner
      DB_PASSWORD: planner
      PUBLIC_ORIGIN: http://localhost:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      # Every request from the host arrives from the Docker gateway address, so the per-IP
      # limits would be shared by all local e2e runs and demo recordings.
      SESSION_LIMIT_PER_IP_HOUR: "1000"
      CHAT_LIMIT_PER_IP_HOUR: "1000"
      CHAT_LIMIT_PER_IP_DAY: "10000"
      MUTATION_LIMIT_PER_IP_HOUR: "100000"
      IMPORT_LIMIT_PER_IP_HOUR: "10000"
      MCP_LIMIT_PER_IP_HOUR: "100000"
      CHAT_LIMIT_PER_DAY: "100000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      db: {condition: service_healthy}
  app:
    profiles: ["full"]
    build: .
    environment: *appenv
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  pgdata:
